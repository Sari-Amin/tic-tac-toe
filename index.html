<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/script.js"></script>
    <title>Tictactoe</title>
</head>
<body>
    <div class="container">
        <!-- first -->
        <div id="logo-start" class="logo">
            <div class="x">X</div>
            <div class="o">O</div>
        </div>
        <div id="tic-start" class="tictactoe">Tictactoe</div>

        <!-- Mark picker -->
        <div  id = "popup-picker" class = "popup hidden">
               <div class="pick">PICK PLAYER 1'S MARK</div>
               <div class="logo">
               <button id="x" class="x">
                   <div class="x">X</div>
               </button>
               <button id="o" class="o">
                   <div class="o">O</div>
               </button>
               </div>
    
               <div class="remember">REMEMBER: X GOES FIRST</div>
        </div>

        <div id="new-start">
            <button id="newgame" class="newgame">NEW GAME(VS PLAYER)</button>
        </div>


        <!-- gameboard -->
        <div id="top" class="top hidden">
            <div class="logo">
                <div class="x">X</div>
                <div class="o">O</div>
            </div>
            <div id="turn" class="turn x">
                X TURN
            </div>
            <div class="restart-btn" >
                <button id="restart" class="restart">
                    <svg width="35" height="35" >
                        <use href="./assets/restart.svg"></use>
                    </svg>
                </button>
            </div>
        </div>
        <div id="game-grid" class="grid-list hidden">
            <div id="0" class="grid-item" data-id="1"></div>
            <div id="1" class="grid-item" data-id="2"></div>
            <div id="2" class="grid-item" data-id="3"></div>
            <div id="3" class="grid-item" data-id="4"></div>
            <div id="4" class="grid-item" data-id="5"></div>
            <div id="5" class="grid-item" data-id="6"></div>
            <div id="6" class="grid-item" data-id="7"></div>
            <div id="7" class="grid-item" data-id="8"></div>
            <div id="8" class="grid-item" data-id="9"></div>
        </div>
        <div id="bottom" class="bottom hidden">
            <div class="xwin">
                <div>X WINS</div>
                <div id="xwin" style="font-weight: 600;">0</div>
            </div>
            <div class="ties">
                <div>TIES</div>
                <div id="tie" style="font-weight: 600;">0</div>
            </div>
            <div class="owin">
                <div>O WINS</div>
                <div id="owin" style="font-weight: 600;">0</div>
            </div>
            <button id="quit" class="quit">
                    <div class="quit">QUIT</div>
            </button>
        </div>
        <!-- popup after game end -->
        <div  id = "popup-endgame" class = "popup hidden">
            <div id="won" class="won">YOU WON!</div>
            <div id="wonround" class="wonround"> X TAKES ROUND </div>
            <div class="round">
            <button id="quit" class="quit">
                <div class="quit">QUIT</div>
            </button>
            <button id="next-round" class="next">
                <div class="next">NEXT ROUND</div>
            </button>
            </div>
        
        </div>
    </div>

</body>
</html>
